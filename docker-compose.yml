services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: word-search-backend
    network_mode: host
    environment:
      - DATABASE_PATH=/app/data/wordsearch.db
      - PORT=3001
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: word-search-frontend
    network_mode: host
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
